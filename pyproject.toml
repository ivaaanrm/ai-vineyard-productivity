[project]
name = "ai-vineyard-productivity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.15",
    "geopandas>=1.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.0,<3",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "ruff>=0.15.1",
    "scipy>=1.12",
    "seaborn>=0.13",
    "shapely>=2.0",
    "streamlit>=1.30",
    "streamlit-folium>=0.18",
    "netcdf4>=1.6",
    "xarray>=2026.2.0",
    "zarr>=3.1.5",
    "python-dotenv>=1.2.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "nbformat>=5.10.4",
    "nbconvert>=7.17.0",
    "nbclient>=0.10.4",
    "scikit-learn>=1.8.0",
    "rich>=14.3.3",
    "tqdm>=4.67.3",
    "typer>=0.24.1",
    "pyyaml>=6.0.3",
    "rioxarray>=0.22.0",
    "xgboost>=2.1",
    "joblib>=1.4",
    "mlflow>=3.11.1",
    "reportlab>=4.4.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
