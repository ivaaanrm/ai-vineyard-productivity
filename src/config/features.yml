dataset_csv: experiments/PRUEBA00/data/train_df_small_2020.csv
targets_csv: data/datasets/raw/FULL_SPLITS_DATASET.csv

columns:
  - NDVI_mean
  - NDVI_std
  - RVI_mean
  - RVI_std
  # - EVI_mean
  # - EVI_std
  # - LST_C_mean
  # - TP_MM_mean
  # - ET_500m_mean

target_columns:
  - yield_kg_ha
  - alcohol_degree

extractors:
  monthly: true

  phenology_phases:
    phases:
      dormancy:    [12, 1, 2]
      budbreak:    [3, 4]
      flowering:   [5, 6]
      veraison:    [7, 8]
      harvest:     [9, 10]
      postharvest: [11]
    aggs: [mean, max]

  temporal_deltas: true

  peak_metrics: true

  season_metrics:
    threshold_pct: 0.2
    base_percentile: 10.0
    columns:
      - NDVI_mean
