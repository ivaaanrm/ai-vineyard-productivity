# ── I/O ──────────────────────────────────────────────────────────────
# inputs:  dataset_csv, targets_csv
# outputs: output_dir/features.csv
dataset_csv: data/experiments/EXP_20260420/dataset.csv
targets_csv: data/datasets/metadata-tarragona.csv
output_dir: null  # null → same dir as dataset_csv
max_null_pct: 30.0
interpolate_missing: true

columns:
  # ── Sentinel-2 vegetation indices ──────────────────────────────────
  - B02
  - B03
  - B04
  - B05
  - B06
  - B07
  - B08
  - B11
  - NDVI
  - IRECI
  - EVI2
  - S2REP
  # - NDRE
  # - GVMI
  # - GNDVI
  # - DpRVI
  # - VH_VV
  # - VH
  # - LST_C
  # ── ERA5 climate ────────────────────────────────────────────────────
  # - TP_MM        # monthly total precipitation (mm)
  # - T2M_C       # monthly mean temperature (°C)
  # - frost_days   # number of frost days in month (Tmin < 0°C)

target_columns:
  - yield_T_ha
  - area_ha
  - variety
  # - planting_date
  # - province
  # - certification
  # - rainfed

extractors:
  monthly: false
  doy_pivot:
    # doy_start: 60   # March 1
    # doy_end: 274    # September 30

  phenology_phases:
    phases:
      # dormancy:     [1, 2]   # frost risk window
      budbreak:     [3, 4]
      flowering:    [5, 6]
      veraison:     [7, 8]
      harvest:      [8, 9]
      # postharvest:  [10, 11]
    aggs:
      - mean
    # agg_by_column:
    #   TP_MM: [sum]   # total accumulated precipitation per phase

  temporal_deltas: false
  peak_metrics: false

  season_metrics: 
    # threshold_pct: 0.2
    # base_percentile: 10.0
    # columns:
    #   - IRECI

  phase_delta:
  #   agg: mean

  phase_integral:
    columns:
      # - NDVI
      - IRECI
      # - EVI2
      # - B05
      # - TP_MM       # cumulative precipitation per phase
      # - frost_days  # cumulative frost exposure per phase
    phases:
      budbreak:  [3, 4]
      flowering: [4, 5]
      veraison:  [6, 7, 8]
      harvest: [8, 9]
      # flowering_to_veraison: [4, 5, 6, 7, 8]

  boolean_features:
  #   early_peak_threshold: 8

  harvest_date:
  #   pre_harvest_windows: [30, 60]
  #   columns:
  #     - IRECI

  historical_features:
    target_column: yield_T_ha
    variety_column: variety
    split_column: split
    train_label: train

  static_features:
    categorical_columns: [certification, variety]
    one_hot_columns: [variety, province]
    planting_date_column: planting_date
    rainfed_column: rainfed
