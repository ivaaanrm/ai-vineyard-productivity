# ── I/O ──────────────────────────────────────────────────────────────
# inputs:  features_csv, feature_columns_file (optional)
# outputs: experiment_directory/<model>_<ts>/
features_csv: data/experiments/EXP_20260420/features.csv
experiment_directory: data/experiments/EXP_20260420/models

dry_run: false
targets:
  - yield_T_ha
log_transform_target: true

split_column: split
test_size: 0.2
random_state: 42

models:
  xgboost:
    enabled: true
    params:
      n_estimators: [200, 500, 1000]
      early_stopping_rounds: 50
      eval_metric: mae
      max_depth: [3, 5, 7]
      learning_rate: [0.03, 0.05]
      subsample: 0.8
      colsample_bytree: 0.7
      min_child_weight: [3, 5]
      reg_alpha: 0.0
      reg_lambda: 1.0
      random_state: 42

  random_forest:
    enabled: true
    params:
      n_estimators: [500, 1000]
      max_depth: [8, 10]
      min_samples_split: 10
      min_samples_leaf: [2, 3]
      max_features: [0.3, 0.5]
      max_samples: 0.8
      criterion: absolute_error
      random_state: 42

# ── MLflow ────────────────────────────────────────────────────────────
mlflow:
  enabled: true
  tracking_uri: sqlite:///mlruns.db
  experiment_name: vineyard-productivity
  log_artifacts: true
