# ── I/O ──────────────────────────────────────────────────────────────
# inputs:  features_csv, feature_columns_file (optional)
# outputs: experiment_directory/<model>_<ts>/
features_csv: experiments/EXP_20260330/data/features.csv
# feature_columns_file: experiments/PRUEBA00/data/train_columns.txt
experiment_directory: experiments/EXP_20260330

dry_run: false
targets:
  - yield_kg_ha

split_column: split
test_size: 0.2
random_state: 42

models:
  xgboost:
    enabled: true
    params:
      n_estimators: [100, 500, 1000]
      early_stopping_rounds: 50
      eval_metric: mae
      max_depth: [3, 5]
      learning_rate: [0.03, 0.05]
      subsample: 0.7
      colsample_bytree: 0.5
      min_child_weight: 10
      reg_alpha: 1.0
      reg_lambda: 5.0
      random_state: 42

  random_forest:
    enabled: false
    params:
      n_estimators: [200, 500]
      max_depth: [6, 8]
      min_samples_split: 15
      min_samples_leaf: 5
      max_features: 0.4
      max_samples: 0.8
      criterion: absolute_error
      random_state: 42

# ── MLflow ────────────────────────────────────────────────────────────
mlflow:
  enabled: true
  tracking_uri: mlruns
  experiment_name: vineyard-productivity
  log_artifacts: true
