# Dataset pipeline configuration
# --------------------------------
# stats:         spatial statistics to compute per band/index per timestep
#                available: mean, std, median, p25, p75, min, max
#
# sensors:
#   compute_indices: indices to compute and append to the cube
#                    available S2: NDVI, EVI, SAVI, NBR2, NDWI
#                    available S1: RVI, VH_VV
#                    available S3: LST_C
#   output_bands:    bands/indices to include in the tabular output
#                    (subset of native bands + compute_indices)

stats:
  - mean
  - std
  - median

sensors:
  SENTINEL-2:
    compute_indices:
      - NDVI
      - EVI
      # - SAVI
      # - NBR2
      # - NDWI
    output_bands:
      - NDVI
      - EVI
      # - SAVI
      # - NBR2
      # - NDWI
      # - B04   # Red
      # - B08   # NIR
      # - B11   # SWIR1

  SENTINEL-1:
    compute_indices:
      - RVI
      - VH_VV
      - DpRVI
    output_bands:
      - VV
      # - VH
      # - RVI
      - VH_VV
      - DpRVI

  SENTINEL-3:
    compute_indices:
      - LST_C
    output_bands:
      - LST
      - LST_C
