parcel_mask: true
fuse_sensors: true

paths:
  aoi_table: /Users/ivanr/Developer/ai-vineyard-productivity/agrixel-fair-dockerV2/data/input/aoi_table.csv

# Temporal aggregation (optional)
temporal:
  resample:
    freq: "ME"       # pandas offset: MS=month-start, 4W=4-weeks, 2W=biweekly, ME=month-end
    agg: "median"    # mean, median, min, max, sum, std
  rolling:
    window: 2
    min_periods: 1
    agg: "mean"

stats:
  - mean
  - std
  # - median

sensors:
  SENTINEL-2:
    compute_indices:
      - NDVI
      - EVI
      # - SAVI
      # - NBR2
      # - NDWI
    output_bands:
      - NDVI
      - EVI
      # - SAVI
      # - NBR2
      # - NDWI
      # - B04   # Red
      # - B08   # NIR
      # - B11   # SWIR1

  SENTINEL-1:
    compute_indices:
      - RVI
      - VH_VV
      # - DpRVI
    output_bands:
      # - VV
      # - VH
      - RVI
      - VH_VV
      # - DpRVI

  SENTINEL-3:
    compute_indices:
      - LST_C
    output_bands:
      - LST
      - LST_C
